# rules v0 — krx-stock-scoring 배점·임계값의 단일 기준 (SPEC v2.3 §4.2·§4.5)
#
# 출처: idea_md/README.md + krx-stock-scoring-plan-v1.0.md §2.4 (기술·기본 35점 개정판).
# `pending = true`는 아직 확정되지 않은 항목이다. 2026-09-20 기준 뉴스 하나만 남았다(사전 검증 D7).
# 나머지 보완값은 M1~M2 실측으로 확정했다 — 방향·경계의 타당성 검증은 M6이다.
# 이 파일을 바꾸면 해시가 바뀌고, 다른 해시의 점수는 같은 시계열로 연결하지 않는다 (SPEC §4.1).
#
# tiers = [[경계, 점수], ...] — 위에서부터 먼저 만족하는 단계 하나만 준다.
#   cmp = "ge"(값 ≥ 경계) · "le"(값 ≤ 경계) · "lt"(값 < 경계) · "gt"(값 > 경계)
#   단계에 세 번째 원소가 있으면 그 단계만 그 비교를 쓴다 — 예: [0.0, 1, "gt"] = 흑자(>0)면 1

[meta]
version = "v0"
profile = "common"
experimental = true
timezone = "Asia/Seoul"

[model]
# v2.6 — 뉴스 9점을 공통에 넣어 99점. 환산하지 않는다(총점 = 원점수, 뉴스는 음수 가능)
common_max = 100         # 기술 35 + 기본 36 + 공시 7 + 수급 13 + 뉴스 9 (v2.7)
axes = { technical = 35, fundamental = 36, disclosure = 7, flow = 13, news = 9 }

[eligibility]
coverage_total_min = 0.80   # 잠정 점수 표시 하한 (D3 초깃값)
coverage_axis_min = 0.60

[grade]
cuts = [75, 60, 45]         # A/B/C, 그 아래 D — 실험 컷 (D6, M6 검증 전 확정 게시 금지)

[screen]
tech_min = 21               # passes_screen: 기술 ≥ 21/35
sma_order = [5, 20, 60]     # 그리고 일봉 SMA5 > SMA20 > SMA60

[universe]
# 보조 판별 (SPEC §1.3) — 공식 분류 출처가 생기면 그쪽이 우선
special_sectors = ["기타금융", "증권", "보험", "은행", "금융"]   # + 이름에 '리츠'
new_listing_sessions = 120      # 일봉이 이보다 적으면 new_listing 표지

[technical]
# M1 보완값 — 재현성을 위해 입력 창을 고정한다 (같은 T면 같은 창)
window_sessions = 400           # 달력 기준 최근 400거래일 (SMA120·월봉 12개월·지표 워밍업)
rsi_min_bars = 100              # Wilder 평활의 시드 영향이 (13/14)^100 ≈ 6e-4 이하가 되도록
macd_min_bars = 150             # EMA26 시드 + 시그널 9 + 수렴 여유
min_valid_ratio = 0.8           # 창 안 유효(비정지) 거래일 비율 하한 — 미달이면 missing

[fundamental]
# v2.6 — EPS·BPS는 네이버 정의: TTM 순이익 / (보통주+우선주 상장주식수)
ttm = true                      # 직전 사업연도 + 당기 누적 − 전년 동기 누적
annualize_fallback = true       # TTM 불가 시 누적을 12개월로 연환산하고 basis=annualized
preferred_prefix_len = 5        # 우선주 묶음 — 티커 앞 5자리 (2026-09-20 실측: 114개 전부 매칭)

# M2 보완값 — 재무 신선도와 표본 (SPEC §5.3 · D4)
interim_max_age_days = 270      # 최신 정기보고서 기간 말이 T보다 이만큼 이전이면 stale
annual_max_age_days = 548       # 최신 사업보고서 회계연도 말 기준 (ROE·적자 확인)
period_tolerance_days = 7       # 당기·전기 누적 기간 길이 차 허용
filing_lag_days = 14            # 기간 말 + 이 일수 이전에는 그 보고서를 부르지 않는다 (호출 절약)

# ───────────────────────── 기술 35 ─────────────────────────

[items."tech.alignment"]
axis = "technical"
max = 11
# 일봉 SMA 쌍 [짧은, 긴, 점수] — 짧은 > 긴이면 점수
daily_pairs = [[5, 20, 2], [20, 60, 2], [60, 120, 2]]
# 완성 주봉 SMA5 > SMA20
weekly_pair = [5, 20, 2]
# 완성 월봉 종가 > 12개월 SMA
monthly_close_above = [12, 3]

[items."tech.trend"]
axis = "technical"
max = 6
slope_sma = 20
slope_lookback = 5          # 보완: SMA20(T) > SMA20(T-5)
slope_points = 2
golden_cross = [20, 60]
golden_window = 20          # 최근 20거래일 안에 SMA20이 SMA60을 상향 돌파
golden_points = 2
close_above_sma = 20
close_points = 2

[items."tech.volume"]
axis = "technical"
max = 6
ratio = [5, 20]             # 5일 평균 거래량 / 20일 평균 거래량
ratio_cmp = "ge"
ratio_tiers = [[1.5, 3], [1.2, 2], [1.0, 1]]
updown_window = 20          # 보완: 20일 중 상승일 평균 거래량 > 하락일 평균
updown_points = 3

[items."tech.volume_profile"]
axis = "technical"
max = 7
window = 60                 # 보완 — OHLCV 근사, 실제 매물대 아님
bins = 20
price = "hlc3"
poc_points = 4              # 현재가 > POC
overhead_cmp = "lt"
overhead_tiers = [[0.10, 3], [0.25, 2], [0.40, 1]]   # 현재가 위 매물 비중

[items."tech.rsi_macd"]
axis = "technical"
max = 5
rsi_period = 14             # 보완: Wilder
rsi_band = [45, 70]
rsi_points = 2
macd = [12, 26, 9]          # 보완: EMA
macd_points = 3             # MACD > 시그널 & 히스토그램 확대

# ───────────────────────── 기본 35 ─────────────────────────

[items."fund.per"]
axis = "fundamental"
max = 6
basis = "sector_median_ratio"   # (종가 ÷ TTM EPS) / 업종 중앙값 — v2.6
cmp = "le"
tiers = [[0.7, 6], [1.0, 4], [1.3, 2]]
adverse_points = 0              # 적자 확인(adverse_defined)
sector_min_samples = 5          # 미만이면 시장 중앙값 폴백

[items."fund.pbr"]
axis = "fundamental"
max = 5
basis = "sector_median_ratio"   # (종가 ÷ BPS) / 업종 중앙값 — v2.6
cmp = "le"
tiers = [[0.8, 5], [1.2, 3], [2.0, 2], [3.0, 1]]
sector_min_samples = 5

[items."fund.op_margin"]
axis = "fundamental"
max = 7
cmp = "ge"
tiers = [[20.0, 7], [15.0, 5], [10.0, 4], [5.0, 2], [0.0, 1, "gt"]]   # % — 흑자(>0)면 1

[items."fund.growth"]
axis = "fundamental"
max = 6
cmp = "ge"
revenue_tiers = [[30.0, 3], [15.0, 2], [5.0, 1]]      # 누적 매출 YoY %
op_income_tiers = [[30.0, 3], [15.0, 2], [5.0, 1]]    # 누적 영업이익 YoY %
op_turnaround = 3           # 확정(2026-09-20): 전년 누적 영업이익 ≤ 0 → 당기 > 0이면 최고 단계와 같게

[items."fund.roe"]
axis = "fundamental"
max = 5
cmp = "ge"
tiers = [[15.0, 5], [10.0, 3], [5.0, 2], [0.0, 1, "gt"]]

[items."fund.debt_ratio"]
axis = "fundamental"
max = 3
cmp = "le"
tiers = [[100.0, 3], [200.0, 2], [300.0, 1]]

[items."fund.div"]
axis = "fundamental"
max = 4
source = "krx_div"          # v2.7 — KRX 공표 배당수익률(pykrx DIV)을 그대로 쓴다
cmp = "ge"
tiers = [[5.0, 4], [3.0, 2], [1.0, 1]]   # % — 무배당 0%는 관측(0점)
# 확정(2026-09-20). 2,531종목 실측 분포: 0점 1,510 · 1점 454 · 2점 323 · 4점 244

# ───────────────────────── 공시 7 ─────────────────────────

[items."disc.dart"]
axis = "disclosure"
max = 7
window_days = 30
base = 4.0
positive = 1.5
negative = -2.0
floor = 0.0
fatal_points = 0.0          # 유효 fatal 사건은 0으로 덮어쓴다
tiers = [[0, 7]]            # 도달 가능 만점 표기용 (base + 호재, 0~7 제한)

# ───────────────────────── 수급 13 ─────────────────────────

[flow]
# M2 보완값 — 수급 창과 유효 비율 (SPEC §5.4)
window_long = 20
window_short = 5
min_valid_ratio = 0.8       # 창 안 자료가 이 비율 미만이면 결측

[items."flow.foreign"]
axis = "flow"
max = 6
value = "foreign_net + foreign_etc_net"
streak_cmp = "ge"
streak_tiers = [[5, 3], [3, 2], [1, 1]]   # 연속 순매수 거래일
cum_windows = [20, 5]                     # 20일 누적 > 0 그리고 5일 누적 > 0
cum_points = 3

[items."flow.inst"]
axis = "flow"
max = 5
value = "inst_net"
streak_cmp = "ge"
streak_tiers = [[5, 3], [3, 2], [1, 1]]
cum_windows = [20, 5]
cum_points = 3
cap = 5                     # 확정(2026-09-20): 외국인과 같은 방식으로 세고 5점에서 자른다

[items."flow.shorting"]
axis = "flow"
max = 2
window = 20                 # 일별 ratio의 20거래일 산술평균 — 잔고 아님
cmp = "lt"
# 시장별 경계 — 2026-09-20 실측 20일 평균 분포의 하위 25%·50%에서 잡았다
#   KOSPI  p25 0.77 · p50 3.08  /  KOSDAQ p25 0.34 · p50 1.96
# 낮을수록 좋다는 방향은 M6 검증 대상이다 (SPEC §5.4)
tiers = [[0.8, 2], [3.0, 1]]                       # 기본값(KOSPI 기준)
markets = { KOSPI = [[0.8, 2], [3.0, 1]], KOSDAQ = [[0.35, 2], [2.0, 1]] }
# 확정(2026-09-20) — 방향(낮을수록 높은 점수)의 타당성은 M6 검증 대상

# ───────────────────── 별도 · 비활성 ─────────────────────

[items."news.naver"]
axis = "news"
max = 9                     # v2.6 — 공통 점수. 기사 3건 × ±3 → −9 ~ +9
min = -9
role = "common"
window_days = 7
max_articles = 3
per_article = 3             # 호재 +3 · 악재 −3 · 중립 0
tiers = [[0, 9]]            # 도달 가능 만점 표기용
pending = true              # 사전 검증(D7) 전에는 확정 등급을 게시하지 않는다

[items."flow.credit"]
axis = "flow"
max = 2
role = "inactive"           # KIS 미도입 — 종목별 missing 목록에 넣지 않는다 (V4)
tiers = [[0, 2]]
