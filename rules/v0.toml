# rules v0 — krx-stock-scoring 배점·임계값의 단일 기준 (SPEC v2.3 §4.2·§4.5)
#
# 출처: idea_md/README.md + krx-stock-scoring-plan-v1.0.md §2.4 (기술·기본 35점 개정판).
# `pending = true` 항목은 원본에 값이 없거나(보완) M2에서 실측 확정한다 — 확정 전 계산은 experimental.
# 이 파일을 바꾸면 해시가 바뀌고, 다른 해시의 점수는 같은 시계열로 연결하지 않는다 (SPEC §4.1).
#
# tiers = [[경계, 점수], ...] — 위에서부터 먼저 만족하는 단계 하나만 준다.
#   cmp = "ge"(값 ≥ 경계) · "le"(값 ≤ 경계) · "lt"(값 < 경계)

[meta]
version = "v0"
profile = "common"
experimental = true
timezone = "Asia/Seoul"

[model]
common_max = 90          # 기술 35 + 기본 35 + 공시 7 + 수급 13
display_scale = 100      # total = 100 × raw_total / 90
axes = { technical = 35, fundamental = 35, disclosure = 7, flow = 13 }

[eligibility]
coverage_total_min = 0.80   # 잠정 점수 표시 하한 (D3 초깃값)
coverage_axis_min = 0.60

[grade]
cuts = [75, 60, 45]         # A/B/C, 그 아래 D — 실험 컷 (D6, M6 검증 전 확정 게시 금지)

[screen]
tech_min = 21               # passes_screen: 기술 ≥ 21/35
sma_order = [5, 20, 60]     # 그리고 일봉 SMA5 > SMA20 > SMA60

# ───────────────────────── 기술 35 ─────────────────────────

[items."tech.alignment"]
axis = "technical"
max = 11
# 일봉 SMA 쌍 [짧은, 긴, 점수] — 짧은 > 긴이면 점수
daily_pairs = [[5, 20, 2], [20, 60, 2], [60, 120, 2]]
# 완성 주봉 SMA5 > SMA20
weekly_pair = [5, 20, 2]
# 완성 월봉 종가 > 12개월 SMA
monthly_close_above = [12, 3]

[items."tech.trend"]
axis = "technical"
max = 6
slope_sma = 20
slope_lookback = 5          # 보완: SMA20(T) > SMA20(T-5)
slope_points = 2
golden_cross = [20, 60]
golden_window = 20          # 최근 20거래일 안에 SMA20이 SMA60을 상향 돌파
golden_points = 2
close_above_sma = 20
close_points = 2

[items."tech.volume"]
axis = "technical"
max = 6
ratio = [5, 20]             # 5일 평균 거래량 / 20일 평균 거래량
ratio_cmp = "ge"
ratio_tiers = [[1.5, 3], [1.2, 2], [1.0, 1]]
updown_window = 20          # 보완: 20일 중 상승일 평균 거래량 > 하락일 평균
updown_points = 3

[items."tech.volume_profile"]
axis = "technical"
max = 7
window = 60                 # 보완 — OHLCV 근사, 실제 매물대 아님
bins = 20
price = "hlc3"
poc_points = 4              # 현재가 > POC
overhead_cmp = "lt"
overhead_tiers = [[0.10, 3], [0.25, 2], [0.40, 1]]   # 현재가 위 매물 비중

[items."tech.rsi_macd"]
axis = "technical"
max = 5
rsi_period = 14             # 보완: Wilder
rsi_band = [45, 70]
rsi_points = 2
macd = [12, 26, 9]          # 보완: EMA
macd_points = 3             # MACD > 시그널 & 히스토그램 확대

# ───────────────────────── 기본 35 ─────────────────────────

[items."fund.per"]
axis = "fundamental"
max = 7
basis = "sector_median_ratio"   # PER / 업종 유효 양수 표본 중앙값
cmp = "le"
tiers = [[0.7, 7], [1.0, 5], [1.3, 2]]
adverse_points = 0              # 적자 확인(adverse_defined)
sector_min_samples = 5          # 미만이면 시장 중앙값 폴백

[items."fund.pbr"]
axis = "fundamental"
max = 6
basis = "sector_median_ratio"
cmp = "le"
tiers = [[0.8, 6], [1.2, 4], [2.0, 3], [3.0, 2]]
sector_min_samples = 5

[items."fund.op_margin"]
axis = "fundamental"
max = 7
cmp = "ge"
tiers = [[20.0, 7], [15.0, 5], [10.0, 4], [5.0, 2], [0.0, 1]]   # % — 0 초과(흑자)면 1

[items."fund.growth"]
axis = "fundamental"
max = 7
cmp = "ge"
revenue_tiers = [[30.0, 4], [15.0, 2], [5.0, 1]]      # 누적 매출 YoY %
op_income_tiers = [[30.0, 3], [15.0, 2], [5.0, 1]]    # 누적 영업이익 YoY %
pending = true              # 전년 값 ≤ 0(흑자전환) 처리를 M2에서 확정

[items."fund.roe"]
axis = "fundamental"
max = 5
cmp = "ge"
tiers = [[15.0, 5], [10.0, 3], [5.0, 2], [0.0, 1]]

[items."fund.debt_ratio"]
axis = "fundamental"
max = 3
cmp = "le"
tiers = [[100.0, 3], [200.0, 2], [300.0, 1]]

# ───────────────────────── 공시 7 ─────────────────────────

[items."disc.dart"]
axis = "disclosure"
max = 7
window_days = 30
base = 4.0
positive = 1.5
negative = -2.0
floor = 0.0
fatal_points = 0.0          # 유효 fatal 사건은 0으로 덮어쓴다
tiers = [[0, 7]]            # 도달 가능 만점 표기용 (base + 호재, 0~7 제한)

# ───────────────────────── 수급 13 ─────────────────────────

[items."flow.foreign"]
axis = "flow"
max = 6
value = "foreign_net + foreign_etc_net"
streak_cmp = "ge"
streak_tiers = [[5, 3], [3, 2], [1, 1]]   # 연속 순매수 거래일
cum_windows = [20, 5]                     # 20일 누적 > 0 그리고 5일 누적 > 0
cum_points = 3

[items."flow.inst"]
axis = "flow"
max = 5
value = "inst_net"
streak_cmp = "ge"
streak_tiers = [[5, 3], [3, 2], [1, 1]]
cum_windows = [20, 5]
cum_points = 3
cap = 5                                   # 외국인과 같은 방식, 5점 상한
pending = true                            # 하위 배분(상한 적용 방식) M2 확정

[items."flow.shorting"]
axis = "flow"
max = 2
window = 20                 # 일별 ratio의 20거래일 산술평균 — 잔고 아님
cmp = "lt"
tiers = [[0.0, 2]]          # 경계 미정 — 자리표시
pending = true              # 시장별 경계는 M2 분포 실측 후 (M0: KOSPI p50 1.3~3.1% · KOSDAQ 0.5~1.5%)
markets = { KOSPI = [], KOSDAQ = [] }

# ───────────────────── 별도 · 비활성 ─────────────────────

[items."news.naver"]
axis = "news"
max = 8
role = "separate"           # 공통 총점·등급·순위에 미사용
window_days = 7
neutral = 4
tiers = [[0, 8]]
pending = true              # 사전 검증(D7) 전에는 점수 null

[items."flow.credit"]
axis = "flow"
max = 2
role = "inactive"           # KIS 미도입 — 종목별 missing 목록에 넣지 않는다 (V4)
tiers = [[0, 2]]
