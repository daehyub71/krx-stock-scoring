# 뉴스 사전 v1 — 기사 제목을 호재/악재로 가르는 낱말 (SPEC §5.5).
#
# **이 파일이 편집 원본이다.** 고치면 다음 실행부터 적용되고, 사전 버전(해시)이 바뀐다.
# 이미 게시된 점수는 그대로 남는다 — 사전 편집이 과거 점수를 덮지 않는다.
#
# 항목
#   term     사람이 읽는 이름
#   norm     제목에서 찾을 낱말 (공백을 지우고 비교한다)
#   polarity positive | negative
#   priority 작을수록 먼저 본다 — 한 제목에 여럿이 걸리면 이 순서로 정한다
#   exclude  이 말이 함께 있으면 걸리지 않는다 (해소·부정 표현)
#   enabled  false면 내려 둔다 (지우지 않는다)
#
# D7 사전 검증 전까지 experimental이다 — 제목 300건 라벨링으로 정밀도를 재고 사용 여부를 정한다.

