name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 최소 권한 — 코드를 읽기만 한다 (SPEC N24)
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성
        run: pip install -r requirements-dev.txt

      - name: 1. 린트
        run: ruff check .

      - name: 2. 타입 (strict)
        run: mypy

      # 자격증명 없이 도는 테스트만 — db·live 마커는 pyproject addopts가 제외한다
      - name: 3. 테스트
        run: pytest -q
