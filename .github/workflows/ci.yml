name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 최소 권한 — 코드를 읽기만 한다 (SPEC N24)
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0 (node24)
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 의존성
        run: pip install -r requirements-dev.txt

      - name: 1. 린트
        run: ruff check .

      - name: 2. 타입 (strict)
        run: mypy

      # 자격증명 없이 도는 테스트만 — db·live 마커는 pyproject addopts가 제외한다
      - name: 3. 테스트
        run: pytest -q
